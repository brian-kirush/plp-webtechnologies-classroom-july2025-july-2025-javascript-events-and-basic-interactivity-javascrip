<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Web Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome to My Interactive Webpage</h1>

  <!-- Interactive Section 1: Form -->
  <section>
    <h2>Sign Up Form</h2>
    <form id="signupForm">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username">

      <label for="email">Email:</label>
      <input type="text" id="email" name="email">

      <label for="password">Password:</label>
      <input type="password" id="password" name="password">

      <button type="submit">Submit</button>
    </form>
    <p id="formMessage"></p>
  </section>

  <!-- Interactive Section 2: Button Event -->
  <section>
    <h2>Click Counter</h2>
    <button id="clickBtn">Click Me!</button>
    <p>You have clicked <span id="clickCount">0</span> times.</p>
  </section>

  <!-- Interactive Section 3: Live Input -->
  <section>
    <h2>Live Preview</h2>
    <input type="text" id="liveInput" placeholder="Type something...">
    <p>Preview: <span id="livePreview"></span></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
